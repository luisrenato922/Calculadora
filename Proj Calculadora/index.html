<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">

	<title>Calculadora</title>
	<script src="scrip.js" defer></script>
</head>
<body>
	<main>
		
		<div class="calculadora">
			<div class="visor">
				
				<span class="resultado">0</span>
			</div>

			<div class="teclado">
				<div class="tecladoNumerico">
					<button class="botao" id="apagar" type="button">C</button>
					<button class="botao" id="um" type="button">1</button>
					<button class="botao" id="dois" type="button">2</button>
					<button class="botao" id="tres" type="button">3</button>
					<button class="botao" id="quatro" type="button">4</button>
					<button class="botao" id="cinco" type="button">5</button>
					<button class="botao" id="seis" type="button">6</button>
					<button class="botao" id="sete" type="button">7</button>
					<button class="botao" id="oito" type="button">8</button>
					<button class="botao" id="nove" type="button">9</button>
					<button class="botao" id="zero" type="button">0</button>
					<button class="botao" id="virgula" type="button">.</button>
				</div>

				<div class="tecladoOperadores">
					<button class="botaoEspecias" id="adicao" type="button">+</button>
					<button class="botaoEspecias" id="subtracao" type="button">-</button>
					<button class="botaoEspecias" id="multiplicacao" type="button">x</button>
					<button class="botaoEspecias" id="divisao" type="button">/</button>

					<button class="botaoEspecias"id="igual" type="button"> =</button>
				</div>
			</div>

		</div>

	</main>
</body>
</html>
